services:
  ollama:
    image: ollama/ollama:latest
    container_name: retrofit-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Pin to physical CPU core count if you know it (e.g. 8 for an 8-core
      # box). Leaving this unset lets Ollama auto-detect, which is fine —
      # only override if you've benchmarked a specific number working better.
      # - OLLAMA_NUM_THREADS=8

      # Keep the model resident between requests so you don't pay model-load
      # time on every single analyze call during the demo.
      - OLLAMA_KEEP_ALIVE=30m

      # Only matters if this box has an NVIDIA GPU and nvidia-container-toolkit
      # is installed — if you DO have any GPU available, getting Ollama onto
      # it is the single biggest speed lever for VLM inference (seconds
      # instead of tens-of-seconds/CPU). Uncomment the deploy block below too.
      # - OLLAMA_FLASH_ATTENTION=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Uncomment if this machine has an NVIDIA GPU + nvidia-container-toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot helper: pulls every candidate model up front so you can flip
  # ANALYZER_MODEL_NAME during the hackathon without waiting on a download
  # mid-demo. Run explicitly with: docker compose run --rm model-puller
  # (it is NOT part of the normal `docker compose up`, so it won't slow down
  # your regular startup).
  model-puller:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
      for m in qwen2.5vl:3b moondream llava-phi3 gemma3:4b; do
        echo \"Pulling $$m...\";
        curl -s http://ollama:11434/api/pull -d \"{\\\"name\\\":\\\"$$m\\\"}\";
        echo;
      done
      "
    profiles: ["tools"]

volumes:
  ollama_data:
